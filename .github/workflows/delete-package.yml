name: delete-package
on:
  workflow_dispatch:
permissions:
  packages: write
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/delete-package-versions@v5
        with:
          package-name: valheim-webgl
          package-type: container
          min-versions-to-keep: 0
          delete-only-untagged-versions: false
