name: clear-image
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  clear:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p empty
          cd empty
          printf 'FROM scratch\nLABEL org.opencontainers.image.description=cleared\n' > Dockerfile
          docker build -t ghcr.io/mrsh4d0w18/valheim-webgl:empty .
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/mrsh4d0w18/valheim-webgl:empty
      - uses: actions/delete-package-versions@v5
        with:
          package-name: valheim-webgl
          package-type: container
          min-versions-to-keep: 1
          ignore-versions: '^empty$'
          delete-only-untagged-versions: false
